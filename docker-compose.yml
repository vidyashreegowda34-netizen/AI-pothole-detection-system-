version: '3.8'

services:
  # PostgreSQL database with PostGIS for production deployment
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: tumakuru_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: namma_tumakuru
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Express.js REST API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tumakuru_server
    restart: always
    depends_on:
      - db
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/namma_tumakuru?schema=public
      JWT_SECRET: namma_tumakuru_super_secret_jwt_key_2026
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads

  # React + Vite PWA Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tumakuru_client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:
